name: Bug
description: Reporta un defecto reproducible sin datos sensibles
title: "[Bug]: "
body:
  - type: input
    id: agent
    attributes:
      label: Agente afectado
  - type: textarea
    id: reproduce
    attributes:
      label: Reproducción y salida sanitizada
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true

name: CodeQL

# Análisis estático de seguridad sobre el código propio de la CLI.
# Complementa a `lint` en ci.yml: ruff cuida el estilo, CodeQL busca
# patrones explotables (inyección, deserialización, path traversal).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Lunes 06:17 UTC: detecta reglas nuevas sobre código que no cambió.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analizar · python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: python
          queries: security-and-quality

      - name: Analizar
        uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3.37.7
        with:
          category: "/language:python"

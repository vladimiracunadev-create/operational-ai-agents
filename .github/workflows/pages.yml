name: Pages

# Publica la landing page en GitHub Pages.
# El contenido de site/ es una vista generada desde catalog/agents.yaml:
# antes de desplegar se comprueba que no tenga drift, de modo que la página
# publicada no pueda afirmar algo distinto de lo que dice el catálogo.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "catalog/**"
      - "src/operational_agents/site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Desplegar landing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: python -m pip install .

      - name: La landing no puede diferir del catálogo
        run: operational-agents sync --check

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

    {
      "title": "Corregir el presente sin reescribir el pasado",
      "context": "El número de agentes aparece en 9 sitios: badges, texto del README, roadmap y varias entradas del changelog. Un reemplazo global lo dejaría todo «coherente» y falsificaría el registro histórico.",
      "ask": "Actualiza los conteos del README desde la fuente de verdad sin tocar el historial.",
      "walkthrough": [
        "`claim-extraction` — recoge las 9 apariciones sin decidir todavía nada sobre ellas.",
        "`drift-classification` — clasifica cada una: marcador de estado actual o referencia histórica. «v0.1.0 publicó diez agentes» era cierto cuando se escribió.",
        "`documentation-update` — sincroniza solo las 4 del primer grupo y deja las 5 restantes intactas."
      ],
      "returns": "- **Sincronizadas (4)** — badge, párrafo de apertura del catálogo, salida de ejemplo del comando y nota de madurez.\n- **Conservadas (5)** — tres entradas de changelog y dos hitos del roadmap que describen releases pasados.\n- **Criterio aplicado** — ¿la línea afirma cómo está el repositorio ahora, o narra qué pasó en una versión concreta?",
      "status": "`COMPLETED` — la prueba de fuego, buscar el valor viejo junto a un marcador de estado actual, sale vacía."
    },
    {
      "title": "Un diagrama que ya no representa el sistema",
      "context": "La arquitectura cambió en marzo: se retiró un cache y se partió un servicio en dos. El diagrama del README sigue mostrando el sistema de antes, y tres ejemplos de código usan una función renombrada.",
      "ask": "Revisa si los diagramas y los ejemplos de la documentación siguen siendo ciertos.",
      "walkthrough": [
        "`source-resolution` — contrasta cada componente del diagrama contra el código que debería implementarlo.",
        "`link-and-example-verification` — ejecuta los ejemplos en vez de leerlos: 3 de 11 fallan por una función que se renombró.",
        "`report` — declara lo que no pudo resolver en vez de inventarlo."
      ],
      "returns": "- **Diagrama** — 1 componente que ya no existe y 1 servicio que aparece como uno cuando son dos. Corregido.\n- **Ejemplos** — 11 ejecutados, 3 fallaban, 3 corregidos y vueltos a ejecutar.\n- **Sin resolver** — el diagrama muestra una cola de mensajes que no aparece en el código ni en la infraestructura declarada. No se borra sin preguntar: puede vivir fuera de este repositorio.",
      "status": "`PARTIAL` — 2 de 3 frentes cerrados y 1 afirmación pendiente, marcada como tal en vez de resuelta a la ligera."
    }

  "tools": [
    "Read",
    "Glob",
    "Grep",
    "Bash",
    "Edit",
    "Write",
    "Skill"
  ],
  "disallowed_tools": [],
  "skill_dependencies": [
    "repo-coherence-audit",
    "md-lint-fix",
    "md-to-doc",
    "yaml-control"
  ],
  "permission_mode": "default",
  "memory": "project",
  "effort": "medium",
  "max_turns": 22,
  "isolation": "worktree",
  "color": "blue",
  "phases": [
    "scope",
    "claim-extraction",
    "source-resolution",
    "drift-classification",
    "repair-plan",
    "approval",
    "documentation-update",
    "link-and-example-verification",
    "report"
  ],
  "required_inputs": [
    "repository_path",
    "documentation_scope",
    "edit_authorization"
  ],
  "deliverables": [
    "claim_evidence_matrix",
    "drift_report",
    "updated_documentation",
    "unresolved_claims"
  ],

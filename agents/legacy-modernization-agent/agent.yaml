  "scenarios": [
    {
      "title": "Una versión del lenguaje que ya nadie soporta",
      "context": "ERP interno en PHP 5.4 sobre Apache: 180.000 líneas, 40 personas usándolo cada día, cero pruebas automatizadas. La versión dejó de recibir parches hace años y auditoría dio 90 días de plazo.",
      "ask": "Diseña la migración de PHP 5.4 a PHP 8.3 sin interrumpir el servicio.",
      "walkthrough": [
        "`system-map` — inventaria 312 archivos, 27 dependencias sin gestor y 4 puntos que usan `mysql_*`, retirado desde PHP 7.",
        "`contract-baseline` — graba 60 peticiones reales y las convierte en pruebas de caracterización: esa es la línea base contra la que se compara todo lo demás.",
        "`migration-slices` — corta la migración en tramos desplegables y reversibles por separado, en vez de un salto único."
      ],
      "returns": "| Tramo | Qué mueve | Cómo se revierte |\n|---|---|---|\n| 1 | `mysql_*` a PDO, sin tocar el esquema | revertir el commit; la base de datos no cambia |\n| 2 | dependencias a Composer con versiones fijadas | volver al include manual |\n| 3 | 4 archivos con sintaxis retirada en PHP 7 | archivo por archivo |\n| 4-6 | plantillas, sesiones y cabeceras | por tramo, con el anterior ya estable |",
      "status": "`COMPLETED` en diseño — 0 líneas migradas todavía. Cada tramo pide su propia aprobación antes de ejecutarse."
    },
    {
      "title": "Cambiar el motor de datos sin romper a quien lo consume",
      "context": "Tres aplicaciones leen directamente 12 tablas de SQL Server. Quieres mover la lógica a una API, pero dos de ellas las mantiene otro equipo y no puedes coordinar un corte simultáneo.",
      "ask": "Moderniza el acceso a SQL Server manteniendo compatibilidad durante la transición.",
      "walkthrough": [
        "`contract-baseline` — congela el contrato real: qué columnas lee cada consumidor y con qué tipos, medido sobre las consultas que de verdad se ejecutan y no sobre el esquema declarado.",
        "`risk-analysis` — marca las 3 tablas que algún consumidor externo **escribe**, no solo lee: ahí la compatibilidad tiene que ser bidireccional.",
        "`migration-slices` — propone la capa que sostiene a los consumidores antiguos mientras el acceso nuevo convive con ellos."
      ],
      "returns": "- **Capa de compatibilidad** — 12 vistas con los nombres y tipos actuales, para que ningún consumidor note el cambio.\n- **Criterio de retirada** — cuando los tres consumidores no aparezcan en el log de acceso durante 30 días seguidos.\n- **Riesgo señalado** — `pagos_detalle` recibe escrituras desde una aplicación externa: una vista no basta y hace falta coordinación explícita con ese equipo.",
      "status": "`PARTIAL` — plan completo con un punto sin resolver que no depende de código, sino de una conversación entre equipos."
    },
    {
      "title": "Nadie se atreve a tocar ese módulo",
      "context": "`calculo_comisiones.py`: 1.400 líneas, sin pruebas, con tres condicionales que nadie sabe explicar y de los que depende el cierre contable del mes. Cambiarlo asusta más que dejarlo como está.",
      "ask": "Cubre este módulo con pruebas de caracterización antes de que lo toquemos.",
      "walkthrough": [
        "`contract-baseline` — ejecuta el módulo con 200 casos del histórico real y graba la salida tal cual sale, rarezas incluidas.",
        "`risk-analysis` — señala 2 comportamientos que parecen errores: un redondeo al alza y una comisión que puede quedar negativa.",
        "`compatibility-verification` — deja la suite en verde, de modo que cualquier cambio futuro que altere el resultado falle de forma visible."
      ],
      "returns": "- 200 pruebas de caracterización en verde, que fijan el comportamiento **actual**, no el deseado.\n- 2 comportamientos sospechosos documentados y **sin corregir**: cambiarlos altera cifras contables y esa es una decisión de negocio, no técnica.\n- Cobertura del módulo de 0% a 87%; lo no cubierto son las ramas que ningún caso histórico alcanza.",
      "status": "`COMPLETED` — el módulo sigue haciendo exactamente lo mismo que antes. La diferencia es que ahora se puede tocar."
    }

  "category": "software-modernization",
  "risk": "high",
  "description": "Diseña y ejecuta modernizaciones incrementales de sistemas legacy preservando continuidad, contratos y rollback.",
  "delegate_when": "Úsalo para migraciones de lenguaje, framework, base de datos, infraestructura o arquitectura con continuidad operativa.",
  "mission": "Reducir riesgo y deuda técnica mediante una migración gradual respaldada por pruebas de caracterización, observabilidad y reversión.",
  "tools": [
    "Read",
    "Glob",
    "Grep",
    "Bash",
    "Edit",
    "Write",
    "Skill"
  ],
  "disallowed_tools": [],
  "skill_dependencies": [
    "repo-coherence-audit",
    "security-audit",
    "yaml-control",
    "python-version-control",
    "pre-push-guard"
  ],
  "permission_mode": "default",
  "memory": "project",
  "effort": "high",
  "max_turns": 32,
  "isolation": "worktree",
  "color": "orange",
  "phases": [
    "scope",
    "system-map",
    "contract-baseline",
    "risk-analysis",
    "migration-slices",
    "approval",
    "implementation",
    "compatibility-verification",
    "rollback-handoff"
  ],
  "phase_details": {
    "scope": "Delimita qué sistema se moderniza, qué debe seguir funcionando sin interrupción y hasta dónde llega tu autorización.",
    "system-map": "Levanta componentes, integraciones, flujos de datos y dependencias reales del sistema actual, incluidas las que nadie documentó.",
    "contract-baseline": "Fija el comportamiento observable de hoy como contrato mediante pruebas de caracterización, incluidos los defectos que alguien ya puede estar usando.",
    "risk-analysis": "Determina qué puede romperse, a quién afecta, con qué probabilidad y qué señal lo detectaría a tiempo.",
    "migration-slices": "Divide la migración en rebanadas independientes, cada una desplegable y reversible por sí sola. Una migración que solo funciona completa no es incremental.",
    "approval": "Presenta las rebanadas y su orden, y espera una decisión humana antes de mover la primera.",
    "implementation": "Ejecuta una rebanada a la vez, manteniendo el camino antiguo operativo hasta que el nuevo demuestre paridad.",
    "compatibility-verification": "Comprueba paridad contra la línea base: mismos contratos, mismos datos y mismo comportamiento observable.",
    "rollback-handoff": "Entrega el procedimiento de reversión probado, no descrito: qué comando, en cuánto tiempo y con qué pérdida de datos."
  },
  "required_inputs": [
    "system_path",
    "target_state",
    "availability_constraints"
  ],
  "deliverables": [
    "legacy_inventory",
    "contract_baseline",
    "migration_plan",
    "characterization_tests",
    "rollback_plan"
  ],
  "approval_points": [
    "data_migration",
    "contract_break",
    "production_cutover",
    "dependency_removal"
  ],
  "checks": [
    "Mapear entradas, salidas, integraciones, jobs, datos y consumidores antes de cambiar código.",
    "Crear pruebas de caracterización para el comportamiento crítico existente.",
    "Separar compatibilidad temporal de la arquitectura objetivo.",
    "Dividir la migración en rebanadas desplegables y reversibles.",
    "Verificar datos, rendimiento, seguridad y operación en cada rebanada.",
    "Documentar fallback, periodo de convivencia y criterio de retiro del legacy."
  ],
  "non_goals": [
    "Big-bang sin respaldo",
    "Cambiar contratos silenciosamente",
    "Confundir código nuevo con migración terminada"
  ],
  "scenarios": [
    {
      "title": "Una versión del lenguaje que ya nadie soporta",
      "situation": "El sistema corre sobre una versión que dejó de recibir parches y migrarlo de golpe significa apagar el servicio.",
      "ask": "Diseña la migración de PHP 5.4 a PHP 8.3 sin interrumpir el servicio.",
      "delivers": "El inventario de lo que hay, pruebas de caracterización que fijan el comportamiento actual como línea base, un plan de migración por etapas y el plan de reversión de cada una."
    },
    {
      "title": "Cambiar el motor de datos sin romper a quien lo consume",
      "situation": "Quieres mover el acceso a datos a otro motor, pero hay aplicaciones que consumen esas tablas y no puedes coordinarlas todas a la vez.",
      "ask": "Moderniza el acceso a SQL Server manteniendo compatibilidad durante la transición.",
      "delivers": "El contrato actual congelado como línea base, la capa de compatibilidad que sostiene a los consumidores durante la transición y el criterio para retirarla."
    },
    {
      "title": "Nadie se atreve a tocar ese módulo",
      "situation": "Hay una parte del sistema que todos evitan porque no tiene pruebas y nadie recuerda por qué funciona.",
      "ask": "Cubre este módulo con pruebas de caracterización antes de que lo toquemos.",
      "delivers": "Pruebas que capturan el comportamiento real, rarezas incluidas, para que cualquier cambio posterior falle de forma visible en vez de silenciosa."
    }
  ]
